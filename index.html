<style>
/* Monochrome + single blue. White/black only, theme blue as the lone accent on interaction & favorites. Flat rows, hairline rules, pill search, self-managed favorites. */
:root{
  --bg:#ffffff; --fg:#000000; --line:#000000; --accent:#7a3ff0;
  --font:"Zen Kaku Gothic New",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --fg:#ffffff; --line:#ffffff; --accent:#b49bff; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000; --fg:#ffffff; --line:#ffffff; --accent:#b49bff; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.6;
  -webkit-font-smoothing:antialiased;font-weight:400;
  font-feature-settings:"palt" 1;font-kerning:normal;
  line-break:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  background:var(--bg);z-index:20}
a{color:inherit;text-decoration:none}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);
  border-bottom:1px solid var(--line)}
.top-in{max-width:720px;margin:0 auto;
  padding-left:max(18px,env(safe-area-inset-left,0px));
  padding-right:max(18px,env(safe-area-inset-right,0px));
  padding-block:16px 14px;display:flex;flex-direction:column;gap:14px}
.mark{font-weight:700;font-size:1.2rem;letter-spacing:-.01em;color:var(--fg)}
.search{position:relative;display:flex;align-items:center}
.search .ico{position:absolute;left:16px;width:17px;height:17px;color:var(--fg);pointer-events:none}
#q{width:100%;font-family:inherit;font-size:1rem;font-weight:500;color:var(--fg);
  background:var(--bg);border:1.5px solid var(--line);border-radius:999px;
  padding:11px 42px 11px 42px;outline:none}
#q:focus{border-color:var(--accent)}
#q::placeholder{color:var(--fg);font-weight:400}
.clear{position:absolute;right:10px;border:0;background:transparent;color:var(--fg);
  font-size:1.3rem;line-height:1;padding:6px 9px;cursor:pointer}
.clear:hover{color:var(--accent)}

main{max-width:720px;margin:0 auto;
  padding-left:max(18px,env(safe-area-inset-left,0px));
  padding-right:max(18px,env(safe-area-inset-right,0px));
  padding-block:22px 60px}

.sec-h{font-size:1.15rem;font-weight:700;color:var(--fg);letter-spacing:.04em;margin:0 2px}
.rule{height:2px;background:var(--line);margin:10px 0 0}

/* rows: [star] [link: name · tag · arrow] */
.list{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.star{flex:0 0 auto;border:0;background:none;cursor:pointer;color:var(--fg);
  padding:15px 12px 15px 2px;display:flex;align-items:center}
.star svg{width:19px;height:19px;display:block;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}
.star.on{color:var(--accent)}
.star.on svg{fill:currentColor}
.star:hover{color:var(--accent)}
.rlink{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:12px;padding:15px 2px 15px 0}
.rn-wrap{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
.rcat{font-size:.6rem;letter-spacing:.14em;font-weight:500}
.rn{flex:1 1 auto;min-width:0;font-size:.95rem;font-weight:500;color:var(--fg)}
.rn-wrap .rn{flex:none}
.tag{flex:0 0 auto;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;
  font-weight:700;color:var(--fg)}
.arrow{flex:0 0 auto;width:26px;height:12px;color:var(--fg)}
.rlink:hover .rn,.rlink:hover .arrow{color:var(--accent)}

.favempty{padding:18px 4px;font-size:.86rem;font-weight:400;border-bottom:1px solid var(--line)}

/* category accordion */
.cats{margin-top:44px;border-top:1px solid var(--line)}
.cat{border-bottom:1px solid var(--line)}
.cat-h{width:100%;display:flex;align-items:center;gap:12px;background:transparent;border:0;
  font-family:inherit;color:var(--fg);text-align:left;cursor:pointer;padding:17px 2px}
.cat-t{flex:1 1 auto;min-width:0;font-weight:700;font-size:1.02rem;letter-spacing:.02em}
.cat-n{flex:0 0 auto;font-size:.82rem;font-weight:700;font-variant-numeric:tabular-nums}
.chev{flex:0 0 auto;width:16px;height:16px;transition:transform .18s}
.cat[data-open="1"] .chev{transform:rotate(90deg)}
.cat[data-open="1"] .cat-t,.cat-h:hover .cat-t{color:var(--accent)}
/* open panel: indented under an accent bar, lighter & tighter rows so the category rules stay dominant */
.panel{margin:0 0 16px 2px;padding-left:14px;border-left:2px solid var(--accent)}
.panel .row{border-bottom:1px solid color-mix(in srgb,var(--fg) 16%,transparent)}
.panel .row:last-child{border-bottom:0}
.panel .star{padding-block:11px}
.panel .rlink{padding-block:11px}
.panel .rn{font-size:.9rem}

.res-h{font-size:.92rem;font-weight:700;margin:2px 2px 8px}
.res-h b{color:var(--accent)}
.empty{padding:44px 6px;font-size:.92rem;font-weight:400}
mark{background:transparent;color:var(--accent);font-weight:700}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const DEFAULT_FAVS=[
  "https://palette2.nagaoka-id.ac.jp/up/college/guide/gakujireki2026.pdf",
  "https://palette2.nagaoka-id.ac.jp/up/college/campuslife/mail.pdf",
  "https://palette2.nagaoka-id.ac.jp/up/college/phone_number/phone_number_table.pdf",
  "https://calendar.google.com/calendar/u/0/appointments/AcZssZ26DF5_RfGqpwGZlwXwBIespsjHDtApwV51KbQ=",
  "https://palette2.nagaoka-id.ac.jp/up/college/guide/guide2026.pdf",
  "https://palette2.nagaoka-id.ac.jp/up/college/guidance/koukiguidance_gakubu2026.pdf"
];

const ALL=[]; const BYURL={};
CATS.forEach(c=>c.items.forEach(it=>{const o={n:it.n,u:it.u,cat:c.t};ALL.push(o);if(!BYURL[it.u])BYURL[it.u]=o;}));

function tagFor(u){
  const s=u.toLowerCase();
  if(/forms\.gle|\/forms\//.test(s))return"Form";
  if(/docs\.google\.com\/spreadsheets/.test(s))return"Sheet";
  if(/youtube\.com|youtu\.be/.test(s))return"動画";
  if(/drive\.google\.com|docs\.google\.com/.test(s))return"Drive";
  if(/\.pdf(\?|#|$)/.test(s))return"PDF";
  if(/\.docx?(\?|#|$)/.test(s))return"Word";
  if(/\.xlsx?(\?|#|$)/.test(s))return"Excel";
  return"Web";
}
const ARROW='<svg class="arrow" viewBox="0 0 34 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6h30"/><path d="M26 1l6 5-6 5"/></svg>';
const STAR='<svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 5.9 6.5.95-4.7 4.58 1.11 6.47L12 17.9 6.19 20.5l1.11-6.47L2.6 9.45l6.5-.95z"/></svg>';

function loadFavs(){try{const s=localStorage.getItem('nid_favs');if(s){const a=JSON.parse(s);if(Array.isArray(a))return a;}}catch(e){}return DEFAULT_FAVS.slice();}
function saveFavs(){try{localStorage.setItem('nid_favs',JSON.stringify(favs));}catch(e){}}
let favs=loadFavs();
const isFav=u=>favs.indexOf(u)>=0;

function rowHTML(u,nameHTML,catLabel){
  const on=isFav(u)?' on':'';
  const body=catLabel
    ? `<span class="rn-wrap"><span class="rcat">${catLabel}</span><span class="rn">${nameHTML}</span></span>`
    : `<span class="rn">${nameHTML}</span>`;
  return `<div class="row"><button class="star${on}" data-u="${encodeURIComponent(u)}" aria-label="お気に入り">${STAR}</button>`
    + `<a class="rlink" href="${u}" target="_blank" rel="noopener">${body}<span class="tag">${tagFor(u)}</span>${ARROW}</a></div>`;
}

const favEl=document.getElementById('fav');
function renderFav(){
  if(!favs.length){favEl.innerHTML='<div class="favempty">★を押すと、ここに追加されます。</div>';return;}
  favEl.innerHTML=favs.map(u=>{const o=BYURL[u];return o?rowHTML(u,o.n,null):'';}).join('');
}
function syncStars(u){
  document.querySelectorAll('.star').forEach(b=>{
    if(decodeURIComponent(b.dataset.u)===u)b.classList.toggle('on',isFav(u));
  });
}
function toggleFav(u){
  const i=favs.indexOf(u);
  if(i>=0)favs.splice(i,1);else favs.push(u);
  saveFavs();renderFav();syncStars(u);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('.star');
  if(!b)return;
  e.preventDefault();
  toggleFav(decodeURIComponent(b.dataset.u));
});

const catsEl=document.getElementById('cats');
catsEl.innerHTML=CATS.map((cat,i)=>{
  const rows=cat.items.map(it=>rowHTML(it.u,it.n,null)).join('');
  return `<section class="cat" data-open="0">
    <button class="cat-h" aria-expanded="false" aria-controls="p${i}">
      <span class="cat-t">${cat.t}</span>
      <span class="cat-n">${cat.items.length}</span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
    </button>
    <div class="panel" id="p${i}" hidden>${rows}</div>
  </section>`;
}).join('');

const sections=[...catsEl.querySelectorAll('.cat')];
function setOpen(sec,open){
  sec.dataset.open=open?'1':'0';
  sec.querySelector('.cat-h').setAttribute('aria-expanded',open?'true':'false');
  sec.querySelector('.panel').hidden=!open;
}
sections.forEach(sec=>{
  sec.querySelector('.cat-h').addEventListener('click',()=>setOpen(sec,sec.dataset.open!=='1'));
});

const q=document.getElementById('q');
const clearBtn=document.getElementById('clear');
const browse=document.getElementById('browse');
const results=document.getElementById('results');
const resList=document.getElementById('res-list');
const resCount=document.getElementById('res-count');
const emptyEl=document.getElementById('empty');
function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function hl(name,raw){return raw?name.replace(new RegExp('('+esc(raw)+')','ig'),'<mark>$1</mark>'):name;}
function run(){
  const raw=q.value.trim();
  const term=raw.toLowerCase();
  clearBtn.hidden=!raw;
  if(!term){results.hidden=true;browse.hidden=false;return;}
  browse.hidden=true;results.hidden=false;
  const m=ALL.filter(x=>x.n.toLowerCase().includes(term));
  resCount.innerHTML='検索結果 <b>'+m.length+'</b> 件';
  emptyEl.hidden=m.length>0;
  resList.innerHTML=m.map(x=>rowHTML(x.u,hl(x.n,raw),x.cat)).join('');
}
q.addEventListener('input',run);
clearBtn.addEventListener('click',()=>{q.value='';q.focus();run();});

renderFav();
</script>
